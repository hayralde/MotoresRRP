<style>
  :root {
    --bg: #F5F1E8;
    --surface: #FFFFFF;
    --surface-2: #F8F6F0;
    --border: #E8E0C8;
    --text: #1A2E1A;
    --text-strong: #0F3D2E;
    --muted: #7A8A6A;
    --green: #174A2B;
    --green-2: #2E7D32;
    --gold: #D4A017;
    --gold-soft: #FFF6DC;
    --gold-ink: #7A5A00;
    --danger: #B3261E;
    --danger-soft: #FCE8E6;
    --ok-soft: #E4F2E5;
    --shadow: 0 1px 2px rgba(23,74,43,.05), 0 8px 24px rgba(23,74,43,.06);
    --nav-bg: rgba(248,246,240,.92);
    --appbar: #174A2B;
  }
  :root[data-theme="dark"] {
    --bg: #0F2015;
    --surface: #172A1E;
    --surface-2: #1C3A25;
    --border: #25432F;
    --text: #F5F1E8;
    --text-strong: #F5F1E8;
    --muted: #A8C4A0;
    --green: #2E7D32;
    --green-2: #3F9A44;
    --gold: #E0B02A;
    --gold-soft: #2A2A12;
    --gold-ink: #E0B02A;
    --danger: #F2B8B5;
    --danger-soft: #3B1C1A;
    --ok-soft: #173A20;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --nav-bg: rgba(23,42,30,.92);
  --appbar: #174A2B;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F2015;
      --surface: #172A1E;
      --surface-2: #1C3A25;
      --border: #25432F;
      --text: #F5F1E8;
      --text-strong: #F5F1E8;
      --muted: #A8C4A0;
      --green: #2E7D32;
      --green-2: #3F9A44;
      --gold: #E0B02A;
      --gold-soft: #2A2A12;
      --gold-ink: #E0B02A;
      --danger: #F2B8B5;
      --danger-soft: #3B1C1A;
      --ok-soft: #173A20;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --nav-bg: rgba(23,42,30,.92);
      --appbar: #174A2B;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .display { font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; letter-spacing: -0.01em; }

  /* barra do app */
  .appbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--appbar);
    color: #F5F1E8;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
  }
  .appbar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .appbar img { width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0; }
  .appbar-in .grow { flex: 1; min-width: 0; }
  #themeBtn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(245,241,232,.14); color: #F5F1E8; font-size: 1.2rem; cursor: pointer; flex-shrink: 0; }
  #themeBtn:active { transform: scale(.94); }
  .appbar .t { font-size: 1.05rem; font-weight: 700; line-height: 1.15; }
  .appbar .s { font-size: .72rem; color: #E0B02A; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 40px); }

  /* busca */
  .search-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .search-label { font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 4px 8px; }
  .field { position: relative; }
  #tagInput {
    width: 100%;
    font: 700 1.45rem 'Space Grotesk', 'Inter', sans-serif;
    letter-spacing: .5px;
    text-transform: uppercase;
    padding: 15px 48px 15px 16px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--surface-2);
    color: var(--text-strong);
    -webkit-appearance: none; appearance: none;
  }
  #tagInput:focus { outline: none; border-color: var(--green-2); background: var(--surface); box-shadow: 0 0 0 4px rgba(46,125,50,.15); }
  #clearBtn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: var(--border); color: var(--text-strong);
    font-size: 1.1rem; line-height: 1; cursor: pointer;
  }
  #clearBtn:active { transform: translateY(-50%) scale(.94); }
  .hint { color: var(--muted); font-size: .8rem; margin: 10px 4px 0; }

  #result { margin-top: 16px; }

  /* status */
  .status-card {
    display: flex; align-items: center; gap: 12px;
    border-radius: 18px; padding: 16px 18px;
    font-weight: 700; font-size: 1.1rem;
    border: 1px solid transparent;
  }
  .status-card .ic { font-size: 1.6rem; line-height: 1; }
  .status-card small { display: block; font-weight: 500; font-size: .8rem; opacity: .85; margin-top: 2px; }
  .status-ok   { background: var(--ok-soft);     color: var(--green-2); border-color: rgba(46,125,50,.3); }
  .status-warn { background: var(--gold-soft);   color: var(--gold-ink); border-color: rgba(212,160,23,.45); }
  .status-bad  { background: var(--danger-soft); color: var(--danger);   border-color: rgba(179,38,30,.3); }
  :root[data-theme="dark"] .status-ok { color: #8FD694; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .status-ok { color: #8FD694; } }

  .missing-box {
    margin-top: 12px; border-radius: 16px; padding: 14px 16px;
    background: var(--gold-soft); border: 1px solid rgba(212,160,23,.4);
  }
  .missing-box.bad { background: var(--danger-soft); border-color: rgba(179,38,30,.3); }
  .missing-box .mb-title { font-weight: 700; font-size: .85rem; margin-bottom: 8px; }
  .missing-box ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .missing-box li { font-size: .85rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }

  .details {
    margin-top: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .details .tag-title {
    padding: 16px 18px; font-size: 1.25rem; font-weight: 700; color: #F5F1E8;
    background: linear-gradient(135deg, #174A2B, #2E7D32);
  }
  .details .tag-title span { display: block; font-family: 'Inter', sans-serif; font-size: .75rem; font-weight: 500; opacity: .85; margin-top: 2px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: .95rem; }
  .row:last-child { border-bottom: none; }
  .row.core-missing { background: var(--gold-soft); }
  .row .label { color: var(--muted); flex-shrink: 0; }
  .row .value { text-align: right; font-weight: 600; color: var(--text-strong); word-break: break-word; }
  .row .value.empty { color: var(--muted); font-weight: 400; font-style: italic; }
  .row .value.empty.core { color: var(--gold-ink); font-weight: 600; font-style: normal; }

  /* sugestões */
  .suggestions { margin-top: 12px; }
  .label-sm { color: var(--muted); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin: 0 4px 8px; }
  .sugg-item {
    padding: 14px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 8px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    box-shadow: var(--shadow);
  }
  .sugg-item:active { background: var(--surface-2); transform: scale(.99); }
  .sugg-item .tag { font-weight: 700; color: var(--text-strong); display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--green-2); } .dot.partial { background: var(--gold); } .dot.empty { background: var(--danger); }
  .sugg-item .setor { color: var(--muted); font-size: .78rem; text-align: right; max-width: 55%; }
  .more { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 4px; }

  /* resumo */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 6px; text-align: center; box-shadow: var(--shadow); }
  .stat .n { font-size: 1.5rem; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .stat.ok .n { color: var(--green-2); } .stat.warn .n { color: var(--gold); } .stat.bad .n { color: var(--danger); }

  .footer { margin-top: 26px; color: var(--muted); font-size: .72rem; text-align: center; line-height: 1.7; }
  .footer b { color: var(--text-strong); }

</style>
</head>

<header class="appbar">

</header>

<main class="wrap">

    </div>
    <div class="hint">Complete a tag ou digite parte dela para buscar</div>
  </section>

  <div id="result"></div>

  <div class="stats">
    <div class="stat ok"><div class="n" id="stOk">–</div><div class="l">completos</div></div>
    <div class="stat warn"><div class="n" id="stPartial">–</div><div class="l">parciais</div></div>
    <div class="stat bad"><div class="n" id="stEmpty">–</div><div class="l">sem dados</div></div>
  </div>

  <div class="footer" id="footer"></div>
</main>

const INDEX = DATA.map(d => ({ d, n: norm(d["TAG/CTE"]), st: coreStatus(d).state }));
const input = document.getElementById("tagInput");
const result = document.getElementById("result");

function escapeHtml(s) {
  return s.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderDetails(d) {
  const status = coreStatus(d);
  let statusCard = "", missingBox = "";
  if (status.state === "ok") {
    statusCard = `<div class="status-card status-ok"><span class="ic">✅</span><div>CATALOGADO<small>Dados de placa completos</small></div></div>`;
  } else if (status.state === "partial") {
    statusCard = `<div class="status-card status-warn"><span class="ic">⚠️</span><div>PARCIAL<small>Faltam dados de placa</small></div></div>`;
    missingBox = `<div class="missing-box"><div class="mb-title">Falta levantar em campo:</div>
      <ul>${status.missing.map(f => `<li>${escapeHtml(LABEL_MAP[f] || f)}</li>`).join("")}</ul></div>`;
  } else {
    statusCard = `<div class="status-card status-bad"><span class="ic">❌</span><div>NÃO CATALOGADO<small>Nenhum dado levantado ainda</small></div></div>`;
    missingBox = `<div class="missing-box bad"><div class="mb-title">Precisa coletar tudo:</div>
      <ul>${CORE_FIELDS.map(f => `<li>${escapeHtml(LABEL_MAP[f] || f)}</li>`).join("")}</ul></div>`;
  }
  let rows = "";
  for (const [key, label] of FIELD_LABELS) {
    let v = d[key];
    const empty = isEmpty(v);
    const isCore = CORE_FIELDS.includes(key);
    if (empty) v = "não informado";
    rows += `<div class="row${empty && isCore ? " core-missing" : ""}"><div class="label">${label}</div><div class="value${empty ? " empty" : ""}${empty && isCore ? " core" : ""}">${escapeHtml(v)}</div></div>`;
  }
  const setor = d["Setor (Objeto de Custo)"];
  return `${statusCard}${missingBox}
    <div class="details">
      <div class="tag-title display">${escapeHtml(d["TAG/CTE"])}${setor ? `<span>${escapeHtml(setor)}</span>` : ""}</div>
      ${rows}
    </div>`;
}

function renderList(title, items, total) {
  return `<div class="suggestions"><div class="label-sm">${title}</div>` +
    items.map(s => `
      <div class="sugg-item" data-tag="${escapeHtml(s.d["TAG/CTE"])}">
        <span class="tag"><i class="dot ${s.st}"></i>${escapeHtml(s.d["TAG/CTE"])}</span>
        <span class="setor">${escapeHtml(s.d["Setor (Objeto de Custo)"] || "")}</span>
      </div>`).join("") +
    (total > items.length ? `<div class="more">+ ${total - items.length} outras — continue digitando para filtrar</div>` : "") +
    `</div>`;
}

function renderNotFound(query, matches) {
  const list = matches.length ? renderList("Tags parecidas", matches.slice(0, 12), matches.length) : "";
  return `<div class="status-card status-bad"><span class="ic">❓</span><div>TAG NÃO EXISTE NA BASE<small>Nada igual a "${escapeHtml(query)}" no cadastro</small></div></div>${list}`;
}

function doSearch(raw) {
  const q = raw.trim();
  const nq = norm(q);
  // só o prefixo padrão: mostra apenas a dica, sem despejar a base inteira
  if (!nq || nq === "ME") { result.innerHTML = ""; return; }
  const exact = INDEX.find(x => x.n === nq);
  if (exact) { result.innerHTML = renderDetails(exact.d); return; }
  const partial = INDEX.filter(x => x.n.includes(nq));
  if (partial.length === 1) { result.innerHTML = renderDetails(partial[0].d); return; }
  result.innerHTML = partial.length
    ? renderList(`${partial.length} tags encontradas`, partial.slice(0, 12), partial.length)
    : renderNotFound(q, partial);
}

input.addEventListener("input", e => doSearch(e.target.value));
input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
document.getElementById("clearBtn").addEventListener("click", () => {
  input.value = "ME-";
  doSearch(input.value);
  input.focus();
  const n = input.value.length;
  input.setSelectionRange(n, n);
});
result.addEventListener("click", e => {
  const item = e.target.closest(".sugg-item");
  if (item) {
    input.value = item.dataset.tag;
    doSearch(item.dataset.tag);
    input.blur();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

// resumo
const cnt = { ok: 0, partial: 0, empty: 0 };
INDEX.forEach(x => cnt[x.st]++);
document.getElementById("stOk").textContent = cnt.ok;
document.getElementById("stPartial").textContent = cnt.partial;
document.getElementById("stEmpty").textContent = cnt.empty;
document.getElementById("footer").innerHTML =
  `Base: <b>${DATA.length}</b> tags cadastradas<br>` +
  `Dados atualizados em ${GENERATED_AT}<br>RRP Bioenergia · Manutenção / PCM`;

// foco com o cursor depois do "ME-" (sem abrir o teclado em celular logo ao carregar)
if (window.matchMedia("(hover: hover)").matches) {
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}


// tema claro / escuro (padrão: o do aparelho)
(() => {
  const root = document.documentElement;
  const btn = document.getElementById("themeBtn");
  const meta = document.querySelector('meta[name="theme-color"]');
  const sysDark = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => (root.dataset.theme || (sysDark.matches ? "dark" : "light")) === "dark";
  function paint() {
    btn.textContent = isDark() ? "☀️" : "🌙";
    meta.content = "#174A2B";
  }
  btn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("motores-theme", next); } catch (e) {}
    paint();
  });
  sysDark.addEventListener("change", paint);
  paint();
})();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
